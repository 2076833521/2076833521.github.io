<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>v2rayN 下载中心</title>
<style>
  :root {
    --accent: #6c5ce7;
    --text: #eef0ff;
    --text-dim: #9aa0c3;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    color: var(--text);
    background: linear-gradient(120deg, #140a3c, #0d1e5e, #3d0f55, #0a3b48, #54103f, #140a3c);
    background-size: 400% 400%;
    animation: flowBg 18s ease infinite;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 20px;
    overflow-x: hidden;
  }

  /* ===== 流光背景：三层效果 ===== */

  /* 1. 色带流动（渐变背景位移） */
  @keyframes flowBg {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  /* 2. 光斑漂移（模糊光晕缓慢移动） */
  body::before {
    content: "";
    position: fixed;
    inset: -20%;
    z-index: 0;
    background:
      radial-gradient(circle at 20% 30%, rgba(124, 108, 255, 0.55), transparent 45%),
      radial-gradient(circle at 80% 70%, rgba(0, 220, 170, 0.50), transparent 45%),
      radial-gradient(circle at 60% 20%, rgba(255, 90, 120, 0.30), transparent 40%);
    filter: blur(48px) saturate(180%);
    pointer-events: none;
    animation: drift 20s ease-in-out infinite alternate;
  }

  @keyframes drift {
    0%   { transform: translate3d(-4%, -2%, 0) rotate(0deg); }
    50%  { transform: translate3d(4%, 3%, 0) rotate(3deg); }
    100% { transform: translate3d(-2%, 4%, 0) rotate(-2deg); }
  }

  /* 3. 流光带（锥形渐变缓慢旋转扫过） */
  body::after {
    content: "";
    position: fixed;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: conic-gradient(
      from 0deg at 50% 50%,
      transparent 0deg,
      rgba(124, 108, 255, 0.18) 60deg,
      transparent 120deg,
      transparent 180deg,
      rgba(0, 220, 170, 0.18) 240deg,
      transparent 300deg
    );
    pointer-events: none;
    z-index: 0;
    animation: spin 24s linear infinite;
  }

  @keyframes spin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }

  /* 内容层保持在流光之上 */
  .header, .versions { position: relative; z-index: 1; }
  .hint { position: relative; z-index: 0; }

  /* ===== 头部 ===== */
  .header { text-align: center; margin-bottom: 48px; }

  .header h1 {
    font-size: 32px;
    letter-spacing: 1px;
  }

  .header p {
    color: var(--text-dim);
    margin-top: 8px;
    font-size: 15px;
  }

  /* ===== 版本卡片 ===== */
  .versions {
    display: flex;
    flex-wrap: wrap;
    gap: 24px;
    justify-content: center;
    max-width: 860px;
    width: 100%;
  }

  .card {
    position: relative;
    flex: 1 1 340px;
    max-width: 400px;
    background: rgba(255, 255, 255, 0.07);
    border: 1px solid rgba(255, 255, 255, 0.16);
    border-radius: 20px;
    padding: 28px;
    backdrop-filter: blur(14px) saturate(160%);
    -webkit-backdrop-filter: blur(14px) saturate(160%);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
    transition: transform .2s, background .2s, box-shadow .2s;
  }

  .card:hover {
    transform: translateY(-4px);
    background: rgba(255, 255, 255, 0.12);
    box-shadow: 0 16px 48px rgba(108, 92, 231, 0.35);
  }

  .card .icon {
    width: 56px;
    height: 56px;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    margin-bottom: 16px;
  }

  .icon.android { background: rgba(0, 184, 148, .15); }
  .icon.windows { background: rgba(108, 92, 231, .15); }

  .card h2 { font-size: 22px; }
  .card .desc { color: var(--text-dim); font-size: 13px; margin: 6px 0 20px; }
  .card .tag {
    display: inline-block;
    font-size: 12px;
    padding: 3px 10px;
    border-radius: 999px;
    background: rgba(0, 184, 148, .15);
    color: #55efc4;
    margin-left: 8px;
    vertical-align: middle;
  }

  /* 下载主按钮 */
  .btn-download {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--accent), #a29bfe);
    color: #fff;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: filter .2s, transform .1s;
  }

  .btn-download:hover { filter: brightness(1.1); }
  .btn-download:active { transform: scale(.98); }

  /* ===== 展开的下载方式（浮层，不撑开页面） ===== */
  .download-options {
    display: none;
    position: absolute;
    top: calc(100% + 10px);
    left: 0;
    right: 0;
    z-index: 20;
    padding: 12px;
    background: rgba(18, 20, 42, 0.96);
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 14px;
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
    animation: fadeSlide .2s ease;
  }

  .download-options.open { display: block; }

  @keyframes fadeSlide {
    from { opacity: 0; transform: translateY(-6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .option {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 12px 16px;
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.10);
    margin-bottom: 8px;
  }

  .option:last-child { margin-bottom: 0; }

  .option .info { display: flex; align-items: center; gap: 12px; }
  .option .badge {
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 8px;
    white-space: nowrap;
  }

  .badge.airplane { background: rgba(253, 203, 110, .15); color: #ffeaa7; }
  .badge.direct { background: rgba(85, 239, 196, .15); color: #55efc4; }

  .option .name { font-size: 14px; }

  .option a {
    display: inline-block;
    padding: 8px 20px;
    border-radius: 10px;
    text-decoration: none;
    font-size: 14px;
    font-weight: 600;
    transition: filter .2s;
    white-space: nowrap;
  }

  .option a.ap-btn  { background: #fdcb6e; color: #2d3436; }
  .option a.dl-btn  { background: #00b894; color: #fff; }
  .option a:hover    { filter: brightness(1.1); }

  .hint { color: var(--text-dim); font-size: 12px; margin-top: 16px; text-align: center; }
</style>
</head>
<body>

  <!-- 头部 -->
  <div class="header">
    <h1>v2rayN 下载中心</h1>
    <p>选择你的平台，点击下载即可获取对应版本</p>
  </div>

  <!-- 版本卡片 -->
  <div class="versions" id="versions"></div>

  <p class="hint">提示：小飞机网盘需跳转网页后下载，直链可点击后立即开始下载</p>

<script>
  // ===== 下载配置：在这里填写你的真实链接 =====
  const DOWNLOADS = [
    {
      id: "android",
      platform: "Android",
      icon: "🤖",
      tag: "v4.0+",
      desc: "支持 Android 8.0 及以上系统，含订阅、路由分流等功能",
      links: {
        airplane: "https://share.feijipan.com/s/9e6fMt4p",
        direct: "https://png.xrvi.top/file/1786202305903_XR_VPN_1.0.0.apk"
      }
    },
    {
      id: "windows",
      platform: "Windows",
      icon: "🪟",
      tag: "v6.x",
      desc: "适用于 Win10 / Win11，支持 64 位系统",
      links: {
        airplane: "https://share.feijipan.com/s/mT6fPmDG",
        direct: "https://png.xrvi.top/file/1786198689731_v2rayN.exe"
      }
    }
  ];

  const ICON_CLASS = { android: "android", windows: "windows" };

  // ===== 渲染卡片 =====
  const root = document.getElementById("versions");
  root.innerHTML = DOWNLOADS.map((item) => `
    <div class="card">
      <div class="icon ${ICON_CLASS[item.id]}">${item.icon}</div>
      <h2>${item.platform}<span class="tag">${item.tag}</span></h2>
      <p class="desc">${item.desc}</p>
      <button class="btn-download" data-id="${item.id}">⬇ 下载 ${item.platform} 版</button>

      <div class="download-options" id="options-${item.id}">
        <div class="option">
          <div class="info">
            <span class="badge airplane">小飞机网盘</span>
            <span class="name">小飞机网盘</span>
          </div>
          <a class="ap-btn" href="${item.links.airplane}" target="_blank" rel="noopener">前往下载</a>
        </div>
        <div class="option">
          <div class="info">
            <span class="badge direct">直链</span>
            <span class="name">服务器直链</span>
          </div>
          <a class="dl-btn" href="${item.links.direct}" download>立即下载</a>
        </div>
      </div>
    </div>
  `).join("");

  // ===== 点击切换下载方式（同一时间只展开一个） =====
  const panels = document.querySelectorAll(".download-options");

  document.querySelectorAll(".btn-download").forEach((btn) => {
    btn.addEventListener("click", (e) => {
      const panel = document.getElementById(`options-${btn.dataset.id}`);
      const wasOpen = panel.classList.contains("open");

      // 收起所有面板
      panels.forEach((p) => p.classList.remove("open"));
      // 若之前未展开则展开当前面板
      if (!wasOpen) panel.classList.add("open");

      e.stopPropagation();
    });
  });

  // 点击浮层内部不收起
  panels.forEach((p) => p.addEventListener("click", (e) => e.stopPropagation()));

  // 点击页面其他区域收起浮层
  document.addEventListener("click", () => {
    panels.forEach((p) => p.classList.remove("open"));
  });
</script>

</body>
</html>
