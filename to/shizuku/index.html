<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Shizuku</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f8f8f8;
            color: #333;
            overflow-x: hidden;
            position: relative;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
        }

        body::before {
            content: '';
            position: fixed;
            z-index: 0;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url(https://img.moehu.org/pic.php?id=sjpic&size=mw1024&cdn=cf) center/cover no-repeat;
            opacity: 0.9;
        }

        .loader-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255,255,255,0.9);
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
        }

        .loader-gif {
            max-width: 300px;
            max-height: 300px;
            object-fit: contain;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 1;
            background: rgba(255,255,255,0.6);
            border-radius: 15px;
            margin-top: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
        }

        .header {
            text-align: center;
            padding: 40px 0;
        }

        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 3px solid #fff;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            margin: 0 auto 20px;
            transition: transform 0.3s ease;
            display: block;
        }

        .name {
            font-size: 2.2em;
            background: linear-gradient(135deg, #ff6b6b, #4ecdc4, #45b7d1);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
            font-weight: 500;
            display: inline-block;
        }

        .bio {
            font-size: 1.1em;
            color: #666;
            line-height: 1.6;
            max-width: 600px;
            margin: 0 auto;
        }
        
        .social-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }

        .social-link {
            padding: 12px 25px;
            background: rgba(255,255,255,0.4);
            border-radius: 30px;
            text-decoration: none;
            color: #2c3e50;
            display: flex;
            align-items: center;
            transition: all 0.3s ease;
            box-shadow: 0 3px 10px rgba(0,0,0,0.5);
            backdrop-filter: blur(8px);
        }

        .social-link:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .ripple-effect {
            position: fixed;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.4);
            animation: ripple 1s ease-out;
            pointer-events: none;
            transform: translate(-50%, -50%);
            z-index: 0.5;
        }

        @keyframes ripple {
            from {
                width: 0;
                height: 0;
                opacity: 1;
            }
            to {
                width: 400px;
                height: 400px;
                opacity: 0;
            }
        }

        @media (max-width: 768px) {
            .avatar {
                width: 100px;
                height: 100px;
            }
            .name {
                font-size: 1.8em;
            }
            .bio {
                font-size: 1em;
                padding: 0 15px;
            }
            .social-links {
                flex-wrap: wrap;
            }
        }
    </style>
</head>
<body>
<div class="loader-overlay" id="loader">
    <img class="loader-gif" id="randomGif" alt="loading...">
</div>

    <div class="container">
        <header class="header">
            <img src="http://q.qlogo.cn/headimg_dl?dst_uin=2843833170&spec=640&img_type=jpg" 
                 alt="Shizuku" 
                 class="avatar">
            <h1 class="name">Shizuku</h1>
            <div class="bio">
                <p>欢迎来到我的个人空间！</p>
                <p>这里记录着我的生活点滴、兴趣爱好和创作分享。</p>
                <p>希望能与你一起分享美好时光～</p>
            </div>
        </header>

        <div class="social-links">
            <a href="https://b23.tv/EfbnN4u" class="social-link">📘 bilibili</a>
            <a href="https://qm.qq.com/q/d3KmuK3k5i" class="social-link">📧 QQ群</a>
        </div>
    </div>

    <script>
        // 随机加载GIF
        const gifs = [
            "https://dl2.img.timecdn.cn/2025/03/01/8E73EC4F0260978A99535940091ECA15_0.gif",
            "https://dl.img.timecdn.cn/2025/03/01/69FFEB036E6CDE0FB0D6B195C1C2237A_0.gif",
            "https://dl3.img.timecdn.cn/2025/03/01/C4F45D181C3542E070210BABFF312826_0.gif"
        ];

        document.getElementById('randomGif').src = gifs[Math.floor(Math.random() * gifs.length)];

        // 页面加载完成后隐藏加载动画
        window.addEventListener('load', function() {
            setTimeout(function() {
                document.getElementById('loader').style.display = 'none';
            }, 1500);
        });

        // 移动端触摸反馈
        document.querySelectorAll('.social-link').forEach(link => {
            link.addEventListener('touchstart', function() {
                this.style.transform = 'scale(0.95)';
            });
            link.addEventListener('touchend', function() {
                this.style.transform = 'scale(1)';
            });
        });
        
        // 涟漪点击效果
        document.addEventListener('click', function(e) {
            const ripple = document.createElement('div');
            ripple.className = 'ripple-effect';
            ripple.style.left = e.clientX + 'px';
            ripple.style.top = e.clientY + 'px';
            document.body.appendChild(ripple);
            setTimeout(() => ripple.remove(), 1000);
        });
    </script>
    <script type="text/javascript" src="https://myhkw.cn/player/js/jquery.min.js"></script>
    <script type="text/javascript" id="myhk" src="https://myhkw.cn/api/player/172408813387" key="172408813387" m="1"></script>
    <script src="http://xmuridt.cn/yinghua.js"></script>
</body>
</html>
