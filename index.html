    <!-- 公告脚本开始 -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 获取公告元素
            var announcement = document.getElementById('announcement');
            
            // 检查localStorage中是否已经有公告显示记录
            if (!localStorage.getItem('announcementShown')) {
                // 显示公告
                announcement.style.display = 'block';
            }

            // 获取关闭按钮
            var closeButton = document.getElementById('closeAnnouncement');
            
            // 添加点击事件监听器
            closeButton.addEventListener('click', function() {
                // 隐藏公告
                announcement.style.display = 'none';
                // 记录到localStorage
                localStorage.setItem('announcementShown', 'true');
            });
        });
        // 显示小窗口
    document.addEventListener('DOMContentLoaded', function() {
    var popupWindow = document.getElementById('popupWindow');
    var floatingButton = document.getElementById('floatingButton');
    var closePopup = document.getElementById('closePopup');

    // 显示小窗口
    floatingButton.addEventListener('click', function() {
        popupWindow.classList.add('active');
        popupWindow.classList.remove('inactive');
    });

    // 关闭小窗口
    closePopup.addEventListener('click', function() {
        popupWindow.classList.remove('active');
        popupWindow.classList.add('inactive');
    });

    // 点击窗口外部关闭小窗口
    window.addEventListener('click', function(event) {
        if (!popupWindow.contains(event.target) && !floatingButton.contains(event.target)) {
            popupWindow.classList.remove('active');
            popupWindow.classList.add('inactive');
        }
    });
});
    </script>

    <!-- 悬浮按钮弹出窗口脚本 -->
    <script>
        $(document).ready(function(){
            // 打开弹出窗口
            $('#floatingButton').on('click', function(){
                $('#popupWindow').fadeIn(300);
            });

            // 关闭弹出窗口
            $('#closePopup').on('click', function(){
                $('#popupWindow').fadeOut(300);
            });

            // 点击窗口外部关闭弹出窗口
            $(document).on('click', function(event){
                if (!$(event.target).closest('#popupWindow, #floatingButton').length) {
                    if ($('#popupWindow').is(':visible')) {
                        $('#popupWindow').fadeOut(300);
                    }
                }
            });
        });
    </script>
